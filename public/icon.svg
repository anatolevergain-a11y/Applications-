<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="380" cy="140" r="50" fill="url(#sunGrad)"/>

  <!-- Distant Peak -->
  <polygon points="120,380 230,190 340,380" fill="#334155" opacity="0.6"/>
  <polygon points="200,240 230,190 260,240" fill="#ffffff" opacity="0.9"/>

  <!-- Main Peak -->
  <polygon points="256,90 440,430 72,430" fill="#1e293b"/>
  <!-- Glacial Snow Cap -->
  <polygon points="256,90 310,190 270,175 256,195 242,175 202,190" fill="url(#snowGrad)"/>

  <!-- Ski Tracks -->
  <path d="M 180 470 Q 256 360 300 290" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 210 480 Q 286 370 330 300" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Skis Cross Icon -->
  <line x1="160" y1="410" x2="352" y2="218" stroke="#ef4444" stroke-width="18" stroke-linecap="round"/>
  <line x1="352" y1="410" x2="160" y2="218" stroke="#ef4444" stroke-width="18" stroke-linecap="round"/>
</svg>
